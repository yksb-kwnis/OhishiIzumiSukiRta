<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>大石泉すきRTA</title>
</head>

<body>
  <div style="display: flex;">
    <p>--&nbsp;</p>
    <p id="message">Press any key to start 大石泉すき</p>
  </div>
  <div style="display: flex;">
    <p>>>&nbsp;</p>
    <p id="target" style="display: flex;"></p>
  </div>
  <p id="result"></p>

  <script>
    const message = document.getElementById("message");
    const target = document.getElementById("target");
    const result = document.getElementById("result");

    const COUNTDOWN_SECONDS = 3;
    const INPUT_PATTERNS = [
      ["o"],
      ["o"],
      ["i"],
      ["si", "shi"],
      ["i"],
      ["zu"],
      ["mi"],
      ["su"],
      ["ki"],
    ];
    const INPUT_CHARS = [
      "お",
      "お",
      "い",
      "し",
      "い",
      "ず",
      "み",
      "す",
      "き",
    ];
    const ANSWERS = INPUT_PATTERNS.reduce(
      (answers, patterns) => {
        return answers.flatMap(answer =>
          patterns.map(pattern =>
            answer + pattern
          )
        );
      },
      [""]
    );

    let isStarted = false;
    let isConverted = false;
    let isAcceptingInput = false;
    let startTime = 0;
    let typed = "";
    let displayText = "";
    let typedPosition = 0;
    let inputCharIndex = 0;


    document.addEventListener("keydown", function (event) {
      if (!isStarted) {
        event.preventDefault();
        isStarted = true;
        isAcceptingInput = false;
        typed = "";
        displayText = "";
        typedPosition = 0;
        inputCharIndex = 0;
        result.textContent = "";
        target.textContent = "";
  
        let countdown = COUNTDOWN_SECONDS;
        message.textContent = countdown;
        const timer = setInterval(() => {
          countdown--;
          if (countdown > 0) {
            message.textContent = countdown;
            return;
          }
          clearInterval(timer);
          message.textContent = "Type \"" + INPUT_CHARS.join("") + "\"";
          isAcceptingInput = true;
          startTime = performance.now();
        }, 1000);
        return;
      }

      if (!isAcceptingInput) {
        return;
      }

      if (!isConverted && ANSWERS.includes(typed) && event.code === "Space") {
        isConverted = true;
        message.textContent = ">> Push [Enter] <<";
        target.textContent = "大石泉すき";
        return;
      }

      if (isConverted && event.key === "Enter") {
        const endTime = performance.now();
        const time = (endTime - startTime) / 1000;
        result.textContent = time.toFixed(3) + "秒";
        isAcceptingInput = false;
        message.textContent = "Finish";
        return;
      }

      const key = event.key.toLowerCase();
      if (!isValidKey(key)) {
        return;
      }
      typed += key;
      updateDisplayText();
  
      if (!isConverted && ANSWERS.includes(typed)) {
        message.textContent = ">> Push [Space] <<";
        return;
      }
    });

    function isValidKey(key) {
      if (!/^[a-z]$/.test(key)) {
        return false;
      }
      const nextTyped = typed + key;
      for (const answer of ANSWERS) {
        if (answer.startsWith(nextTyped)) {
          return true;
        }
      }
      return false;
    }

    function updateDisplayText() {
      const candidates = INPUT_PATTERNS[inputCharIndex];
      for (const candidate of candidates) {
        if (typed.startsWith(candidate, typedPosition)) {
          displayText += INPUT_CHARS[inputCharIndex];
          typedPosition += candidate.length;
          inputCharIndex++;
          break;
        }
      }
      target.textContent = displayText + typed.substring(typedPosition);
    }
  </script>
</body>
</html>
